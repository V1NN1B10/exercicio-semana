<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 3</title>
</head>
<body>
    <script>
        for (let i = 1; i <= 20; i++){
            document.write("Volta numero " + i + "<br>")
        }

        for (let n = 0; n <= 100; n += 10){
            document.write(n)
        }

        document.write("Fim!")
        // iria ficar em um lup Infinito, pq nao tem o i++ pra somar, então seria sempre zero e nunca iria sair disso
    </script>
</body>
</html>
